services:
  - type: web
    name: audit-annotate-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: audit-annotate-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://audit-annotate.onrender.com
      - key: UPLOAD_DIR
        value: /opt/render/project/uploads

  - type: web
    name: audit-annotate-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://audit-annotate-api.onrender.com

databases:
  - name: audit-annotate-db
    databaseName: audit_annotate
    user: audit_annotate
