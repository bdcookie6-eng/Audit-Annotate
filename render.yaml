services:
  # ── FastAPI audit service (private — only your Express app can reach it) ──
  - type: web
    name: audit-annotate-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # "private" means this service is only reachable from other Render services
    # in your account via its internal URL (e.g. http://audit-annotate-api:10000)
    # It is NOT exposed to the public internet.
    plan: starter
    envVars:
      - key: GROQ_API_KEY
        sync: false           # set manually in Render dashboard
      - key: AUDIT_SECRET
        sync: false           # same value must be set in your Express app
      - key: DATABASE_URL
        fromDatabase:
          name: audit-annotate-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://yoursite.com   # replace with your actual domain
      - key: UPLOAD_DIR
        value: /opt/render/project/uploads

  # ── React frontend build (static files served by your Express app) ──
  # We don't deploy this as a separate Render service.
  # Instead: run `npm run build` in /frontend and copy /dist into your
  # Express app's public folder.  See INTEGRATION.md for instructions.

databases:
  - name: audit-annotate-db
    databaseName: audit_annotate
    user: audit_annotate
    plan: starter
