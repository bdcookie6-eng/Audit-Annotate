services:
  - type: web
    name: audit-annotate
    runtime: python
    rootDir: backend
    buildCommand: >
      cd ../frontend && npm install && npm run build &&
      cp -r dist ../backend/static_frontend &&
      cd ../backend && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: audit-annotate-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /opt/render/project/src/backend/uploads

databases:
  - name: audit-annotate-db
    databaseName: audit_annotate
    user: audit_annotate
    plan: starter
